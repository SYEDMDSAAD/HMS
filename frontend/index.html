<!doctype html>
<html lang="en-IN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="UC Healthcare — a multi-speciality hospital with thirteen departments, in-house diagnostics and 24×7 emergency care. Book an appointment online."
    />
    <meta name="theme-color" content="#0d9488" />
    <title>UC Healthcare · Multi-Speciality Hospital</title>
    <!-- Resolve the colour theme before first paint.

         This has to be an inline, blocking script in <head>: if the theme were
         applied from React instead, the page would paint light, then snap to
         dark once the bundle ran. The key must stay in step with
         THEME_STORAGE_KEY in packages/ui/src/theme.js. -->
    <script>
      (function () {
        try {
          var pref = localStorage.getItem("uc-theme") || "system";
          var dark =
            pref === "dark" ||
            (pref === "system" &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.dataset.theme = dark ? "dark" : "light";
        } catch (e) {
          document.documentElement.dataset.theme = "light";
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      This site requires JavaScript. Please enable it in your browser to book an
      appointment, or call the hospital reception directly.
    </noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
